<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setup Business QR</title>
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Maps JS SDK (REPLACE WITH YOUR ACTUAL GOOGLE API KEY) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_PLACES_API_KEY&libraries=places"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .status-msg { font-size: 15px; color: #4b5563; }
    .error-msg { color: #dc2626; font-weight: 600; margin-top: 8px; font-size: 14px; word-break: break-word; }
    
    h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
    
    /* Search Box */
    .input-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
    input { width: 100%; height: 50px; padding: 0 16px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #4f46e5; }

    /* Business Preview Card & Map */
    #business-preview { display: none; margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; text-align: left; background: #fafafa; }
    #map { width: 100%; height: 160px; background-color: #e5e7eb; }
    .preview-info { padding: 16px; }
    .biz-title { font-weight: 700; font-size: 16px; color: #111827; margin-bottom: 4px; }
    .biz-address { font-size: 13px; color: #6b7280; margin-bottom: 16px; }

    .confirm-btn { width: 100%; height: 48px; background: #059669; color: #ffffff; font-size: 16px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; }
    .confirm-btn:active { background: #047857; }

    /* Touch optimization for Google Places dropdown */
    .pac-container { border-radius: 12px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin-top: 6px; font-family: inherit; z-index: 1000; }
    .pac-item { padding: 12px 16px; font-size: 15px; cursor: pointer; }

    /* Success Modal */
    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; z-index: 999; }
    .modal-content { background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; max-width: 360px; width: 100%; animation: popIn 0.3s ease; }
    .checkmark-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    .modal-text { font-size: 14px; color: #4b5563; line-height: 1.5; }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <div id="loading" class="status-msg">Checking QR code status...</div>

  <div id="setup-container" style="display: none;">
    <h1>Find Your Business</h1>
    <p>Search your business name below to link it to this QR code.</p>

    <div class="input-wrapper">
      <input id="business-search" type="text" placeholder="Type business name..." autocomplete="off">
    </div>

    <!-- Map & Preview Container -->
    <div id="business-preview">
      <div id="map"></div>
      <div class="preview-info">
        <div id="biz-title" class="biz-title"></div>
        <div id="biz-address" class="biz-address"></div>
        <button id="ok-btn" class="confirm-btn">Confirm & Link Business</button>
      </div>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div id="success-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="checkmark-icon">✅</div>
    <div class="modal-title">Uploaded Successfully!</div>
    <div class="modal-text">Your business has been linked to this QR code. Future scans will go directly to your Google Review page.</div>
  </div>
</div>

<script>
  // 1. YOUR CREDENTIALS (Make sure these are completely replaced)
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  
  let supabase = null;
  if (typeof window.supabase !== 'undefined') {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  let selectedPlace = null;
  let map = null;
  let marker = null;

  // 2. EXTRACT PARAMETER ID
  const urlParams = new URLSearchParams(window.location.search);
  const qrId = urlParams.get('id');

  async function checkQRStatus() {
    const loadingEl = document.getElementById('loading');

    try {
      if (!qrId) {
        loadingEl.innerHTML = `<h3>Invalid QR Code</h3><p class="error-msg">Missing '?id=' parameter in link.</p>`;
        return;
      }

      if (!supabase) {
        loadingEl.innerHTML = `<h3>System Error</h3><p class="error-msg">Supabase JS failed to load.</p>`;
        return;
      }

      // Fetch row from Supabase
      const { data, error } = await supabase
        .from('qrcodes')
        .select('*')
        .eq('id', qrId)
        .maybeSingle();

      if (error) {
        loadingEl.innerHTML = `<h3>Database Error</h3><p class="error-msg">${error.message}</p>`;
        return;
      }

      if (!data) {
        loadingEl.innerHTML = `<h3>QR Code Not Found</h3><p class="error-msg">ID '${qrId}' does not exist in 'qrcodes' table.</p>`;
        return;
      }

      // REDIRECT IF DESTINATION EXISTS
      if (data.destination_url) {
        window.location.href = data.destination_url;
        return;
      }

      // SHOW SEARCH UI IF NULL
      loadingEl.style.display = 'none';
      document.getElementById('setup-container').style.display = 'block';
      initPlacesAutocomplete();

    } catch (err) {
      loadingEl.innerHTML = `<h3>Error</h3><p class="error-msg">${err.message || err}</p>`;
    }
  }

  // 3. AUTOCOMPLETE & MAP SETUP
  function initPlacesAutocomplete() {
    const input = document.getElementById('business-search');
    
    if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
      alert("Google Maps API failed to load. Please check your API key.");
      return;
    }

    const autocomplete = new google.maps.places.Autocomplete(input, {
      types: ['establishment'],
      fields: ['place_id', 'name', 'formatted_address', 'geometry']
    });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const circle = new google.maps.Circle({
          center: { lat: pos.coords.latitude, lng: pos.coords.longitude },
          radius: pos.coords.accuracy
        });
        autocomplete.setBounds(circle.getBounds());
      });
    }

    autocomplete.addListener('place_changed', () => {
      const place = autocomplete.getPlace();
      if (!place.place_id || !place.geometry) return;

      selectedPlace = place;

      document.getElementById('business-preview').style.display = 'block';
      document.getElementById('biz-title').innerText = place.name;
      document.getElementById('biz-address').innerText = place.formatted_address;

      const location = place.geometry.location;
      if (!map) {
        map = new google.maps.Map(document.getElementById('map'), {
          center: location,
          zoom: 15,
          disableDefaultUI: true
        });
        marker = new google.maps.Marker({ map: map, position: location });
      } else {
        map.setCenter(location);
        marker.setPosition(location);
      }
    });
  }

  // 4. CONFIRM & SAVE
  document.getElementById('ok-btn').addEventListener('click', async () => {
    if (!selectedPlace) return;

    const btn = document.getElementById('ok-btn');
    btn.disabled = true;
    btn.innerText = "Saving...";

    const reviewUrl = `https://search.google.com/local/writereview?placeid=${selectedPlace.place_id}`;

    const { error } = await supabase
      .from('qrcodes')
      .update({
        destination_url: reviewUrl,
        place_id: selectedPlace.place_id
      })
      .eq('id', qrId);

    if (!error) {
      document.getElementById('setup-container').style.display = 'none';
      document.getElementById('success-modal').style.display = 'flex';
    } else {
      alert("Failed to save: " + error.message);
      btn.disabled = false;
      btn.innerText = "Confirm & Link Business";
    }
  });

  window.onload = checkQRStatus;
</script>

</body>
</html>
