<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setup Business QR</title>
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .status-msg { font-size: 15px; color: #4b5563; }
    .error-msg { color: #dc2626; font-weight: 600; margin-top: 8px; font-size: 14px; word-break: break-word; }
    
    h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
    
    /* Inputs */
    .field-group { text-align: left; margin-bottom: 14px; }
    label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
    input { width: 100%; height: 48px; padding: 0 14px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #4f46e5; }

    /* Preview Box */
    #preview-card { display: none; margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; text-align: left; background: #f8fafc; }
    .biz-title { font-weight: 700; font-size: 16px; color: #111827; margin-bottom: 4px; }
    .biz-address { font-size: 13px; color: #6b7280; margin-bottom: 16px; }

    .confirm-btn { width: 100%; height: 48px; background: #059669; color: #ffffff; font-size: 16px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; margin-top: 8px; }
    .confirm-btn:active { background: #047857; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; z-index: 999; }
    .modal-content { background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; max-width: 360px; width: 100%; }
    .checkmark-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    .modal-text { font-size: 14px; color: #4b5563; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card" id="card">
  <div id="loading" class="status-msg">Checking QR code status...</div>

  <div id="setup-container" style="display: none;">
    <h1>Link Your Business</h1>
    <p>Enter your business name and area/city in Anand to connect this QR code directly to Google Reviews.</p>

    <div class="field-group">
      <label>Business / Shop Name</label>
      <input id="biz-name" type="text" placeholder="e.g. Royal Bakery" autocomplete="off">
    </div>

    <div class="field-group">
      <label>City / Location</label>
      <input id="biz-city" type="text" value="Anand, Gujarat" placeholder="e.g. Anand, Gujarat" autocomplete="off">
    </div>

    <button id="preview-btn" class="confirm-btn" style="background: #4f46e5;">Preview Business Link</button>

    <div id="preview-card">
      <div id="preview-title" class="biz-title"></div>
      <div id="preview-address" class="biz-address"></div>
      <button id="ok-btn" class="confirm-btn">Confirm & Save QR Code</button>
    </div>
  </div>
</div>

<div id="success-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="checkmark-icon">✅</div>
    <div class="modal-title">QR Code Ready!</div>
    <div class="modal-text">Your business link has been saved successfully. Future scans will go directly to your business on Google.</div>
  </div>
</div>

<script>
  // Insert your Supabase details below
  const SUPABASE_URL = 'https://jshbvklcvzpzmkrvnaoj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6i2KNjaLhcasDx4lu-xa0w_dh-iqyxQ';
  
  let supabaseClient = null;
  let generatedReviewUrl = '';

  const urlParams = new URLSearchParams(window.location.search);
  const qrId = urlParams.get('id');

  async function checkQRStatus() {
    const loadingEl = document.getElementById('loading');

    try {
      if (typeof window.supabase === 'undefined') {
        loadingEl.innerHTML = `<h3>System Error</h3><p class="error-msg">Supabase library failed to load.</p>`;
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      if (!qrId) {
        loadingEl.innerHTML = `<h3>Invalid QR Code</h3><p class="error-msg">Missing '?id=' parameter in link.</p>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from('qr_codes')
        .select('*')
        .eq('id', qrId)
        .maybeSingle();

      if (error) {
        loadingEl.innerHTML = `<h3>Database Error</h3><p class="error-msg">${error.message}</p>`;
        return;
      }

      if (!data) {
        loadingEl.innerHTML = `<h3>QR Code Not Found</h3><p class="error-msg">ID '${qrId}' does not exist in 'qr_codes' table.</p>`;
        return;
      }

      // If already linked, redirect directly
      if (data.destination_url) {
        window.location.href = data.destination_url;
        return;
      }

      loadingEl.style.display = 'none';
      document.getElementById('setup-container').style.display = 'block';

    } catch (err) {
      loadingEl.innerHTML = `<h3>Error</h3><p class="error-msg">${err.message || err}</p>`;
    }
  }

  // Handle Preview
  document.getElementById('preview-btn').addEventListener('click', () => {
    const name = document.getElementById('biz-name').value.trim();
    const city = document.getElementById('biz-city').value.trim();

    if (!name || !city) {
      alert("Please enter both Business Name and City.");
      return;
    }

    generatedReviewUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' ' + city)}`;

    document.getElementById('preview-title').innerText = name;
    document.getElementById('preview-address').innerText = city;
    document.getElementById('preview-card').style.display = 'block';
  });

  // Handle Save
  document.getElementById('ok-btn').addEventListener('click', async () => {
    if (!generatedReviewUrl) return;

    const btn = document.getElementById('ok-btn');
    btn.disabled = true;
    btn.innerText = "Saving...";

    const { error } = await supabaseClient
      .from('qr_codes')
      .update({
        destination_url: generatedReviewUrl
      })
      .eq('id', qrId);

    if (!error) {
      document.getElementById('setup-container').style.display = 'none';
      document.getElementById('success-modal').style.display = 'flex';
    } else {
      alert("Failed to save: " + error.message);
      btn.disabled = false;
      btn.innerText = "Confirm & Save QR Code";
    }
  });

  window.onload = checkQRStatus;
</script>

</body>
</html>
