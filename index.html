<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setup Business QR</title>
  
  <!-- Leaflet OpenStreetMap CSS & JS (100% Free Maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    #debug-box {
      width: 100%; max-width: 400px; background: #1e293b; color: #f87171;
      padding: 12px; border-radius: 12px; font-family: monospace; font-size: 12px;
      margin-bottom: 16px; word-break: break-all; display: none; text-align: left;
    }

    .card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .status-msg { font-size: 15px; color: #4b5563; }
    .error-msg { color: #dc2626; font-weight: 600; margin-top: 8px; font-size: 14px; word-break: break-word; }
    
    h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
    
    /* Input & Suggestions */
    .input-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
    input { width: 100%; height: 50px; padding: 0 16px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #4f46e5; }

    #suggestions-list { position: absolute; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); max-height: 220px; overflow-y: auto; z-index: 1000; text-align: left; display: none; margin-top: 4px; }
    .suggestion-item { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; color: #334155; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background-color: #f8fafc; }

    /* Map & Preview */
    #business-preview { display: none; margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; text-align: left; background: #fafafa; }
    #map { width: 100%; height: 160px; background-color: #e5e7eb; }
    .preview-info { padding: 16px; }
    .biz-title { font-weight: 700; font-size: 16px; color: #111827; margin-bottom: 4px; }
    .biz-address { font-size: 13px; color: #6b7280; margin-bottom: 16px; }

    .confirm-btn { width: 100%; height: 48px; background: #059669; color: #ffffff; font-size: 16px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; }
    .confirm-btn:active { background: #047857; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; z-index: 999; }
    .modal-content { background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; max-width: 360px; width: 100%; }
    .checkmark-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    .modal-text { font-size: 14px; color: #4b5563; line-height: 1.5; }
  </style>

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var box = document.getElementById('debug-box');
      if (box) {
        box.style.display = 'block';
        box.innerHTML += '<b>JS Error:</b> ' + msg + '<br><small>Line: ' + lineNo + '</small><br><br>';
      }
      return false;
    };
  </script>
</head>
<body>

<div id="debug-box"></div>

<div class="card" id="card">
  <div id="loading" class="status-msg">Checking QR code status...</div>

  <div id="setup-container" style="display: none;">
    <h1>Find Your Business</h1>
    <p>Search your business name and city to link it to this QR code.</p>

    <div class="input-wrapper">
      <input id="business-search" type="text" placeholder="Type business name & city..." autocomplete="off">
      <div id="suggestions-list"></div>
    </div>

    <!-- Map and Preview Container -->
    <div id="business-preview">
      <div id="map"></div>
      <div class="preview-info">
        <div id="biz-title" class="biz-title"></div>
        <div id="biz-address" class="biz-address"></div>
        <button id="ok-btn" class="confirm-btn">Confirm & Link Business</button>
      </div>
    </div>
  </div>
</div>

<div id="success-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="checkmark-icon">✅</div>
    <div class="modal-title">Uploaded Successfully!</div>
    <div class="modal-text">Your business has been linked to this QR code. Future scans will go directly to your Google Review page.</div>
  </div>
</div>

<script>
  // Insert your credentials
  const SUPABASE_URL = 'https://jshbvklcvzpzmkrvnaoj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6i2KNjaLhcasDx4lu-xa0w_dh-iqyxQ';
  
  let supabaseClient = null;
  let selectedPlace = null;
  let leafletMap = null;
  let leafletMarker = null;
  let debounceTimer = null;

  const urlParams = new URLSearchParams(window.location.search);
  const qrId = urlParams.get('id');

  async function checkQRStatus() {
    const loadingEl = document.getElementById('loading');

    try {
      if (typeof window.supabase === 'undefined') {
        loadingEl.innerHTML = `<h3>System Error</h3><p class="error-msg">Supabase library failed to load.</p>`;
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      if (!qrId) {
        loadingEl.innerHTML = `<h3>Invalid QR Code</h3><p class="error-msg">Missing '?id=' parameter in link.</p>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from('qr_codes')
        .select('*')
        .eq('id', qrId)
        .maybeSingle();

      if (error) {
        loadingEl.innerHTML = `<h3>Database Error</h3><p class="error-msg">${error.message}</p>`;
        return;
      }

      if (!data) {
        loadingEl.innerHTML = `<h3>QR Code Not Found</h3><p class="error-msg">ID '${qrId}' does not exist in 'qr_codes' table.</p>`;
        return;
      }

      if (data.destination_url) {
        window.location.href = data.destination_url;
        return;
      }

      loadingEl.style.display = 'none';
      document.getElementById('setup-container').style.display = 'block';
      setupAutocomplete();

    } catch (err) {
      loadingEl.innerHTML = `<h3>Error</h3><p class="error-msg">${err.message || err}</p>`;
    }
  }

  function setupAutocomplete() {
    const input = document.getElementById('business-search');
    const suggestionsList = document.getElementById('suggestions-list');

    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const query = input.value.trim();

      if (query.length < 3) {
        suggestionsList.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          // Explicitly restricted to countrycodes=in (India)
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=5&addressdetails=1`);
          const results = await res.json();

          suggestionsList.innerHTML = '';
          if (results.length === 0) {
            suggestionsList.style.display = 'none';
            return;
          }

          results.forEach(place => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            
            const mainName = place.display_name.split(',')[0];
            item.innerText = place.display_name;

            item.addEventListener('click', () => {
              input.value = mainName;
              suggestionsList.style.display = 'none';
              showBusinessPreview(place, mainName);
            });

            suggestionsList.appendChild(item);
          });

          suggestionsList.style.display = 'block';
        } catch (e) {
          console.error("Search fetch error", e);
        }
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (!input.contains(e.target) && !suggestionsList.contains(e.target)) {
        suggestionsList.style.display = 'none';
      }
    });
  }

  function showBusinessPreview(place, name) {
    selectedPlace = {
      name: name,
      address: place.display_name,
      lat: parseFloat(place.lat),
      lon: parseFloat(place.lon)
    };

    document.getElementById('business-preview').style.display = 'block';
    document.getElementById('biz-title').innerText = name;
    document.getElementById('biz-address').innerText = place.display_name;

    // Render interactive Leaflet map
    if (!leafletMap) {
      leafletMap = L.map('map').setView([selectedPlace.lat, selectedPlace.lon], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(leafletMap);
      leafletMarker = L.marker([selectedPlace.lat, selectedPlace.lon]).addTo(leafletMap);
    } else {
      leafletMap.setView([selectedPlace.lat, selectedPlace.lon], 15);
      leafletMarker.setLatLng([selectedPlace.lat, selectedPlace.lon]);
    }
    
    setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 200);
  }

  document.getElementById('ok-btn').addEventListener('click', async () => {
    if (!selectedPlace) return;

    const btn = document.getElementById('ok-btn');
    btn.disabled = true;
    btn.innerText = "Saving...";

    const reviewUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedPlace.name + ' ' + selectedPlace.address)}`;

    const { error } = await supabaseClient
      .from('qr_codes')
      .update({
        destination_url: reviewUrl
      })
      .eq('id', qrId);

    if (!error) {
      document.getElementById('setup-container').style.display = 'none';
      document.getElementById('success-modal').style.display = 'flex';
    } else {
      alert("Failed to save: " + error.message);
      btn.disabled = false;
      btn.innerText = "Confirm & Link Business";
    }
  });

  window.onload = checkQRStatus;
</script>

</body>
</html>
