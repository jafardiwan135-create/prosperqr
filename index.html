<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setup Business QR</title>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .status-msg { font-size: 15px; color: #4b5563; }
    .error-msg { color: #dc2626; font-weight: 600; margin-top: 8px; font-size: 14px; word-break: break-word; }
    
    h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
    
    .input-wrapper { position: relative; width: 100%; margin-bottom: 12px; text-align: left; }
    label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
    input { width: 100%; height: 50px; padding: 0 16px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #4f46e5; }

    .search-btn { width: 100%; height: 48px; background: #4f46e5; color: #ffffff; font-size: 15px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; margin-bottom: 16px; }
    .search-btn:active { background: #4338ca; }

    /* Search Results List */
    .results-container { display: none; text-align: left; margin-top: 12px; max-height: 280px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
    .result-item { padding: 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.15s; }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: #f8fafc; }
    .res-title { font-weight: 700; font-size: 15px; color: #0f172a; margin-bottom: 2px; }
    .res-address { font-size: 13px; color: #64748b; line-height: 1.3; }
    .res-badge { display: inline-block; font-size: 11px; font-weight: 600; background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; margin-top: 6px; }

    /* Confirmation Box */
    #business-preview { display: none; margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; text-align: left; background: #f8fafc; }
    .biz-title { font-weight: 700; font-size: 16px; color: #111827; margin-bottom: 4px; }
    .biz-address { font-size: 13px; color: #6b7280; margin-bottom: 16px; line-height: 1.4; }

    .confirm-btn { width: 100%; height: 48px; background: #059669; color: #ffffff; font-size: 16px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; }
    .confirm-btn:active { background: #047857; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; z-index: 999; }
    .modal-content { background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; max-width: 360px; width: 100%; }
    .checkmark-icon { font-size: 48px; margin-bottom: 12px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    .modal-text { font-size: 14px; color: #4b5563; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card" id="card">
  <div id="loading" class="status-msg">Checking QR code status...</div>

  <div id="setup-container" style="display: none;">
    <h1>Find Your Business</h1>
    <p>Search your exact shop name and city to pick your business from Google Maps.</p>

    <div class="input-wrapper">
      <label>Business Name & City</label>
      <input id="business-search" type="text" placeholder="e.g. Anand Chashma Ghar Anand" autocomplete="off">
    </div>

    <button id="search-btn" class="search-btn">Search Google Business</button>

    <div id="results-list" class="results-container"></div>

    <div id="business-preview">
      <div id="biz-title" class="biz-title"></div>
      <div id="biz-address" class="biz-address"></div>
      <button id="ok-btn" class="confirm-btn">Confirm & Link QR Code</button>
    </div>
  </div>
</div>

<div id="success-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="checkmark-icon">✅</div>
    <div class="modal-title">QR Code Ready!</div>
    <div class="modal-text">Your exact business profile has been saved. Scans will go directly to your official Google Review box.</div>
  </div>
</div>

<script>
  // Insert your credentials below
  const SERPAPI_KEY = '62f955d6be5746bdb02954ec3c18fe408f58d93f42de5f3e2ced8de7d87d2b45';
  const SUPABASE_URL = 'https://jshbvklcvzpzmkrvnaoj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6i2KNjaLhcasDx4lu-xa0w_dh-iqyxQ';
  
  let supabaseClient = null;
  let selectedReviewUrl = '';

  const urlParams = new URLSearchParams(window.location.search);
  const qrId = urlParams.get('id');

  async function checkQRStatus() {
    const loadingEl = document.getElementById('loading');

    try {
      if (typeof window.supabase === 'undefined') {
        loadingEl.innerHTML = `<h3>System Error</h3><p class="error-msg">Supabase library failed to load.</p>`;
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      if (!qrId) {
        loadingEl.innerHTML = `<h3>Invalid QR Code</h3><p class="error-msg">Missing '?id=' parameter in link.</p>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from('qr_codes')
        .select('*')
        .eq('id', qrId)
        .maybeSingle();

      if (error) {
        loadingEl.innerHTML = `<h3>Database Error</h3><p class="error-msg">${error.message}</p>`;
        return;
      }

      if (!data) {
        loadingEl.innerHTML = `<h3>QR Code Not Found</h3><p class="error-msg">ID '${qrId}' does not exist in 'qr_codes' table.</p>`;
        return;
      }

      if (data.destination_url) {
        window.location.href = data.destination_url;
        return;
      }

      loadingEl.style.display = 'none';
      document.getElementById('setup-container').style.display = 'block';

    } catch (err) {
      loadingEl.innerHTML = `<h3>Error</h3><p class="error-msg">${err.message || err}</p>`;
    }
  }

  // Perform Google Maps Search via SerpApi Proxy
  document.getElementById('search-btn').addEventListener('click', async () => {
    const query = document.getElementById('business-search').value.trim();
    const resultsContainer = document.getElementById('results-list');
    const searchBtn = document.getElementById('search-btn');

    if (!query) {
      alert("Please enter a business name and city.");
      return;
    }

    searchBtn.disabled = true;
    searchBtn.innerText = "Searching Google Maps...";
    resultsContainer.style.display = 'none';
    document.getElementById('business-preview').style.display = 'none';

    try {
      // Direct call to SerpApi Google Maps endpoint via CORS proxy
      const apiUrl = `https://corsproxy.io/?${encodeURIComponent(`https://serpapi.com/search.json?engine=google_maps&q=${encodeURIComponent(query)}&api_key=${SERPAPI_KEY}`)}`;

      const res = await fetch(apiUrl);
      const data = await res.json();

      searchBtn.disabled = false;
      searchBtn.innerText = "Search Google Business";

      if (!data.local_results || data.local_results.length === 0) {
        alert("No Google Business profile found for that search. Try adding your city or street name.");
        return;
      }

      resultsContainer.innerHTML = '';

      data.local_results.forEach(place => {
        const title = place.title || 'Unknown Business';
        const address = place.address || place.snippet || 'Address not listed';
        const placeId = place.place_id;

        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="res-title">${title}</div>
          <div class="res-address">${address}</div>
          ${place.rating ? `<span class="res-badge">⭐ ${place.rating} (${place.reviews || 0} reviews)</span>` : ''}
        `;

        item.addEventListener('click', () => {
          resultsContainer.style.display = 'none';
          document.getElementById('biz-title').innerText = title;
          document.getElementById('biz-address').innerText = address;

          // Constructs the official Google Review Dialog URL using the exact Place ID
          if (placeId) {
            selectedReviewUrl = `https://search.google.com/local/writereview?placeid=${placeId}`;
          } else {
            selectedReviewUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title + ' ' + address)}`;
          }

          document.getElementById('business-preview').style.display = 'block';
        });

        resultsContainer.appendChild(item);
      });

      resultsContainer.style.display = 'block';

    } catch (err) {
      searchBtn.disabled = false;
      searchBtn.innerText = "Search Google Business";
      alert("Search failed: " + err.message);
    }
  });

  document.getElementById('ok-btn').addEventListener('click', async () => {
    if (!selectedReviewUrl) return;

    const btn = document.getElementById('ok-btn');
    btn.disabled = true;
    btn.innerText = "Saving...";

    const { error } = await supabaseClient
      .from('qr_codes')
      .update({
        destination_url: selectedReviewUrl
      })
      .eq('id', qrId);

    if (!error) {
      document.getElementById('setup-container').style.display = 'none';
      document.getElementById('success-modal').style.display = 'flex';
    } else {
      alert("Failed to save: " + error.message);
      btn.disabled = false;
      btn.innerText = "Confirm & Link QR Code";
    }
  });

  window.onload = checkQRStatus;
</script>

</body>
</html>
